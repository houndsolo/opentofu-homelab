# Installed by hand on the PVE nodes (roots/monitoring-config/log-senders). Forwards
# everything journald hands to rsyslog (ForwardToSyslog=yes), plus the kernel log, to the
# Loki/Alloy syslog VIP on the monitoring network: TCP, RFC 5424, octet-counted. A
# disk-assisted queue rides out a receiver outage. The final `stop` keeps rsyslog from
# also writing /var/log/*: the journal stays the local log store.
if prifilt("*.info") then {
  action(
    type="omfwd"
    target="10.5.11.40"
    port="514"
    protocol="tcp"
    template="RSYSLOG_SyslogProtocol23Format"
    TCP_Framing="octet-counted"
    queue.type="LinkedList"
    queue.size="20000"
    queue.filename="loki-fwd"
    queue.maxDiskSpace="128m"
    queue.saveOnShutdown="on"
    action.resumeRetryCount="-1"
    action.resumeInterval="10"
  )
}
stop
