# Installed by hand on the Ceph mon nodes (roots/monitoring-config/log-senders).
# The Ceph cluster log only goes to /var/log/ceph/ceph.log (mon_cluster_log_to_file=true,
# mon_cluster_log_to_journald=false), so read the file. Every mon writes the same cluster
# log: each line arrives once per mon, with that mon's host label. [DBG] lines (the mgr's
# pgmap every 2 s) are dropped; INF/WRN/ERR go on to the forwarder in 30-loki.conf.
module(load="imfile")
input(
  type="imfile"
  File="/var/log/ceph/ceph.log"
  Tag="ceph-cluster"
  Facility="local0"
  Severity="info"
  reopenOnTruncate="on"
  freshStartTail="on"
  ruleset="ceph_cluster"
)
ruleset(name="ceph_cluster") {
  if $msg contains " [DBG] " then stop
  call RSYSLOG_DefaultRuleset
}
