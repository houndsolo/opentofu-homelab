[defaults]
# Run from this folder (cd ansible): the inventory is the whole inventory/ directory, i.e. tfvars.py
# (Proxmox nodes from inventory/auto.tfvars/nodes.auto.tfvars) plus static.yml (gf.pbs).
inventory = ./inventory
# all nodes are Debian 13 / PVE 9 (python3.13): no discovery warning
interpreter_python = auto_silent
# 9 hosts; default is 5
forks = 10
