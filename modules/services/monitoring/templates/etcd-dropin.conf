# Managed by OpenTofu (monitoring-config). Local edits are overwritten.
# Drop-in for Debian's etcd.service: everything comes from the config file (etcd then ignores
# its environment, so /etc/default/etcd has no effect). Type=simple: systemd doesn't wait for
# quorum, so the first deploy can start the members one after the other.
[Unit]
After=network-online.target postgres-guard.service
Wants=network-online.target

[Service]
Type=simple
ExecStart=
ExecStart=/usr/bin/etcd --config-file /etc/etcd/etcd.yml
Restart=always
RestartSec=5
