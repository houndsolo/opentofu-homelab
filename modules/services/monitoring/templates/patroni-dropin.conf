# Managed by OpenTofu (monitoring-config). Local edits are overwritten.
# Drop-in for Debian's patroni.service (User=postgres, KillMode=process, ExecReload=HUP).
[Unit]
After=network-online.target etcd.service postgres-guard.service
Wants=network-online.target

[Service]
# Passwords (superuser, replication, REST API) and pgBackRest's S3 keys: archive_command and
# restore_command inherit them from Patroni (it strips only PATRONI_* from Postgres' env).
EnvironmentFile=/etc/postgres-ha/patroni.env
EnvironmentFile=/etc/postgres-ha/s3.env
# Watchdog: if Patroni hangs while its Postgres is the primary, the VM resets (fencing).
ExecStartPre=-+/sbin/modprobe softdog
ExecStartPre=-+/bin/chown postgres /dev/watchdog
Restart=always
RestartSec=5
# Patroni stops Postgres cleanly (checkpoint) on SIGTERM; the default 30 s can be short.
TimeoutStopSec=120
